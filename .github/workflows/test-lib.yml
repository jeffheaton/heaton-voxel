name: Test Library

# Runs the Python library's test suite on Linux, macOS and Windows, with every
# Python version the library supports, on every push and pull request that can
# change its result. One of those runs measures coverage for Codecov and the
# README badges, and a separate job holds the deterministic tier to mypy, as
# CLAUDE.md's "Verifying" section asks. Releases are made by the manual Release
# workflow (release.yml).
on:
  push:
    paths:
      - 'heaton_voxel/**'
      - 'tests/**'
      # The corpus is regenerated and compared by tests/test_conformance.py.
      - 'fixtures/**'
      # The tests load the probes and the reference builds by path.
      - 'tools/**'
      - 'examples/**'
      - 'pyproject.toml'
      - '.gitattributes'
      - '.github/workflows/test-lib.yml'
  pull_request:
    paths:
      - 'heaton_voxel/**'
      - 'tests/**'
      # The corpus is regenerated and compared by tests/test_conformance.py.
      - 'fixtures/**'
      # The tests load the probes and the reference builds by path.
      - 'tools/**'
      - 'examples/**'
      - 'pyproject.toml'
      - '.gitattributes'
      - '.github/workflows/test-lib.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Lets the Codecov upload authenticate with GitHub's OIDC token, so no Codecov
  # token is stored in the repo.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Finish every combination, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      # One run measures coverage, so the badge stays comparable from run to
      # run: Linux on Python 3.12. The others run the suite plain, which is
      # about twice as fast.
      MEASURE: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The library has no dependencies; coverage is the measuring run's only
      # tool, and it is never one of the package's.
      - name: Install coverage
        if: env.MEASURE == 'true'
        run: python -m pip install "coverage[toml]"

      # unittest, as the suite has always run. MINECRAFT_SAVE is unset, so the
      # live-save tests skip and everything reads fixtures/.
      - name: Run tests
        run: |
          if [ "$MEASURE" = true ]; then
            python -m coverage run -m unittest discover -s tests
            python -m coverage xml -o coverage.xml
            python -m coverage report
          else
            python -m unittest discover -s tests
          fi

      - name: Upload coverage to Codecov
        if: env.MEASURE == 'true'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          flags: python
          # A Codecov outage shouldn't turn the tests badge red.
          fail_ci_if_error: false

  types:
    name: mypy (deterministic tier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install mypy
        run: python -m pip install mypy

      # [tool.mypy] in pyproject.toml lists the files, and the tier stands at
      # no issues; tests/test_architecture.py fails if a lower-tier module is
      # missing from that list.
      - name: Check types
        run: python -m mypy
