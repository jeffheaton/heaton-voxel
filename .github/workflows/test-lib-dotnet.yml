name: Test Library (.NET)

# Runs the C# port's conformance suite on Linux, macOS and Windows on every
# push and pull request that can change its result. The suite is the port's
# test harness: HeatonVoxel.Conformance replays every artifact in
# fixtures/conformance/ and exits nonzero on any failure. The Linux run measures
# the library's coverage under it for Codecov and the README badges. Releases
# are made by the manual Release workflow (release.yml).
on:
  push:
    paths:
      - 'csharp/**'
      # The corpus, and the fixtures it names.
      - 'fixtures/**'
      # Packed into the NuGet package.
      - 'NOTICE'
      - '.gitattributes'
      - '.github/workflows/test-lib-dotnet.yml'
  pull_request:
    paths:
      - 'csharp/**'
      - 'fixtures/**'
      - 'NOTICE'
      - '.gitattributes'
      - '.github/workflows/test-lib-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Lets the Codecov upload authenticate with GitHub's OIDC token, so no Codecov
  # token is stored in the repo.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: .NET on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Finish every platform, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # The library targets netstandard2.1 (what Unity takes); the conformance
      # runner is a net10.0 console app.
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Warnings are errors in both projects, and the NuGet advisory audit runs
      # during restore, so this also fails on a vulnerable or unreachable feed.
      - name: Build (Release)
        run: dotnet build csharp/HeatonVoxel.slnx -c Release

      # The runner finds fixtures/conformance/ by walking up from the working
      # directory, so it runs from the repo root.
      - name: Run the conformance suite
        if: runner.os != 'Linux'
        run: dotnet run --project csharp/HeatonVoxel.Conformance -c Release --no-build

      # coverlet instruments HeatonVoxel.dll beside the runner, runs the suite
      # through it, and fails with the suite: a nonzero exit from the runner is
      # a nonzero exit here. Only the library counts, not the runner itself.
      - name: Run the conformance suite with coverage
        if: runner.os == 'Linux'
        run: |
          dotnet tool install coverlet.console --tool-path "$RUNNER_TEMP/dntools"
          out=csharp/HeatonVoxel.Conformance/bin/Release/net10.0
          "$RUNNER_TEMP/dntools/coverlet" "$out" \
            --target dotnet --targetargs "$out/HeatonVoxel.Conformance.dll" \
            --include "[HeatonVoxel]*" \
            --format cobertura --output coverage.cobertura.xml

      # One upload keeps the badge comparable from run to run.
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.cobertura.xml
          disable_search: true
          flags: dotnet
          # A Codecov outage shouldn't turn the tests badge red.
          fail_ci_if_error: false

      # What a release would publish: the package must pack, README and
      # NOTICE included, on every platform it is built on.
      - name: Pack
        run: dotnet pack csharp/HeatonVoxel/HeatonVoxel.csproj -c Release --no-build -o "$RUNNER_TEMP/nupkgs"
