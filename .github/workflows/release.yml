name: Release

# Publishes one release of both packages from the commit it is run on:
# heaton-voxel to PyPI and HeatonVoxel to NuGet.org. The two versions move
# together (tests/test_architecture.py holds pyproject.toml's and the csproj's
# equal), and the version typed in must be that version, so a release is never
# made from the wrong commit by accident. Both registries use Trusted
# Publishing: GitHub's OIDC token is exchanged for a short-lived credential,
# and no token is stored in the repo. RELEASING.md has the one-time setup.
#
# Nothing is published until both suites pass on this commit. Each registry
# can be skipped, so a publish that failed on one side can be rerun for that
# side alone; the GitHub release and its v<version> tag are made once anything
# has been published, and a rerun adds to them.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release; must be the one in pyproject.toml and the csproj (e.g. 0.1.0)'
        required: true
      pypi:
        description: 'Publish heaton-voxel to PyPI'
        type: boolean
        default: true
      nuget:
        description: 'Publish HeatonVoxel to NuGet.org'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Check the version and run both suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check the branch, the version and the tag
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF."
            exit 1
          fi
          python - <<'EOF'
          import os, re, sys, tomllib
          wanted = os.environ["VERSION"]
          with open("pyproject.toml", "rb") as handle:
              python = tomllib.load(handle)["project"]["version"]
          with open("csharp/HeatonVoxel/HeatonVoxel.csproj", encoding="utf-8") as handle:
              dotnet = re.search(r"<Version>([^<]+)</Version>", handle.read()).group(1)
          with open("heaton_voxel/__init__.py", encoding="utf-8") as handle:
              runtime = re.search(r'^__version__\s*=\s*"([^"]+)"', handle.read(), re.M).group(1)
          print(f"asked for {wanted}; pyproject.toml has {python}, the csproj {dotnet}, "
                f"__version__ {runtime}")
          if not wanted == python == dotnet == runtime:
              print(f"::error::The version asked for ({wanted}) is not the one in "
                    f"pyproject.toml ({python}), the csproj ({dotnet}) and "
                    f"heaton_voxel/__init__.py ({runtime}).")
              sys.exit(1)
          EOF
          # A tag already standing for this version must be this commit's: a
          # rerun for one registry, never a second release under the same name.
          tagged=$(git ls-remote --tags origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | tail -1 | cut -f1)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::v$VERSION is already tagged at $tagged, not this commit ($GITHUB_SHA)."
            exit 1
          fi

      - name: Run the Python suite
        run: python -m unittest discover -s tests

      - name: Run the conformance suite
        run: |
          dotnet build csharp/HeatonVoxel.slnx -c Release
          dotnet run --project csharp/HeatonVoxel.Conformance -c Release --no-build

  build-python:
    name: Build the wheel and sdist
    needs: verify
    if: inputs.pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          ls -l dist

      # The wheel installs into an empty venv, both console scripts run, and
      # both tiers import -- from outside the checkout, so nothing is read from
      # the source tree by accident.
      - name: Install the wheel and try it
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          smoke/bin/heaton-voxel --help > /dev/null
          smoke/bin/heaton-voxel-nbt --help > /dev/null
          smoke/bin/python -c "import heaton_voxel, heaton_voxel.craft; print(heaton_voxel.__version__)"

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  build-dotnet:
    name: Pack the NuGet package
    needs: verify
    if: inputs.nuget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The .nupkg (DLL, IntelliSense XML, README, NOTICE) and its .snupkg of
      # symbols, Source Link pointing the symbols at this commit on GitHub.
      - name: Pack
        run: |
          dotnet pack csharp/HeatonVoxel/HeatonVoxel.csproj -c Release -o nupkgs
          ls -l nupkgs

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: nupkgs/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/heaton-voxel/${{ inputs.version }}/
    permissions:
      # Trusted Publishing: PyPI accepts this workflow's OIDC token in place
      # of an API token.
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-nuget:
    name: Publish to NuGet.org
    needs: build-dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: nuget
      url: https://www.nuget.org/packages/HeatonVoxel/${{ inputs.version }}
    permissions:
      contents: read
      # Trusted Publishing: NuGet/login exchanges this workflow's OIDC token
      # for a short-lived API key.
      id-token: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: nupkgs

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: jeffheaton

      # Pushing the .nupkg pushes the .snupkg beside it to the symbol server.
      - name: Push
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  github-release:
    name: Tag and record the release
    needs: [publish-pypi, publish-nuget]
    if: >-
      ${{ !cancelled() && !contains(needs.*.result, 'failure')
          && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download what was published
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create or add to the GitHub release
        run: |
          ls -l release
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" release/* --clobber
          else
            gh release create "v$VERSION" release/* --target "$GITHUB_SHA" \
              --title "Heaton Voxel $VERSION" --generate-notes
          fi
