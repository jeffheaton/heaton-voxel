name: Deploy Library to NuGet (.NET)

# Publishes the HeatonVoxel package that a Build Library (.NET) run staged on
# S3, by version. Mirrors deploy-lib.yml (the Python package to PyPI).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to deploy (e.g., 0.1.0); deploys HeatonVoxel.<version>.nupkg and its .snupkg'
        required: true

permissions:
  # Creates the release tag.
  contents: write
  # Required for NuGet Trusted Publishing: lets the NuGet/login action request a
  # short-lived OIDC token from GitHub to exchange for a temporary NuGet API key.
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download packages from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: '$VERSION' is not a package version (e.g., 0.1.0)."
            exit 1
          fi
          mkdir -p nupkgs
          for file in "HeatonVoxel.$VERSION.nupkg" "HeatonVoxel.$VERSION.snupkg"; do
            echo "Downloading $file from S3..."
            aws s3 cp "s3://data.heatonresearch.com/library/$file" nupkgs/ || {
              echo "Error: File $file does not exist in S3. Run Build Library (.NET) at this version first."
              exit 1
            }
          done
          ls -l nupkgs
          mkdir -p record
          aws s3 cp "s3://data.heatonresearch.com/library/HeatonVoxel-$VERSION-build.json" record/ || {
            echo "Error: no build record for $VERSION in S3. Run Build Library (.NET) at this version first."
            exit 1
          }

      # The tag records what was released: the commit these files were built
      # from, read from the build record. A tag already standing elsewhere is
      # refused before anything is published.
      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
          RECORD: record/HeatonVoxel-${{ github.event.inputs.version }}-build.json
        run: |
          COMMIT=$(python3 -c "import json, os; print(json.load(open(os.environ['RECORD']))['commit'])")
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq '.object.type + " " + .object.sha' 2>/dev/null || true)
          if [ -z "$ref" ]; then
            echo "v$VERSION is not tagged yet; it will be, at $COMMIT"
            exit 0
          fi
          sha=${ref#* }
          if [ "${ref% *}" = tag ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
          fi
          if [ "$sha" != "$COMMIT" ]; then
            echo "::error::v$VERSION already points at $sha, not $COMMIT, the commit this build came from."
            exit 1
          fi
          echo "v$VERSION is already at $COMMIT"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Trusted Publishing: exchange GitHub's OIDC token for a short-lived NuGet
      # API key (no long-lived secret stored in the repo). Requires a matching
      # trusted-publishing policy on NuGet.org bound to this workflow file --
      # see RELEASING.md.
      - name: NuGet login (Trusted Publishing / OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: jeffheaton

      # Pushing the .nupkg pushes the .snupkg beside it to the symbol server.
      - name: Push to NuGet.org
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION already tagged (checked above)"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$COMMIT" > /dev/null
            echo "Tagged v$VERSION at $COMMIT"
          fi
